<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate natural-sounding speech from text using OpenAI's TTS API or clone voices locally with Qwen3-TTS." />
  <title>Text-to-Speech · Dual Engine</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <span class="header__icon">🔊</span>
    <h1 class="header__title">Text-to-Speech</h1>
    <p class="header__subtitle">OpenAI API · Local Qwen3 Voice Cloning</p>
  </header>

  <!-- Main Card -->
  <main class="card" id="tts-card">
    <form id="tts-form" autocomplete="off">

      <!-- Engine Selector -->
      <div class="form-group">
        <label class="form-label" for="engine-select">Engine</label>
        <select id="engine-select" name="engine">
          <option value="openai" selected>OpenAI API — cloud TTS</option>
          <option value="qwen3">Local Qwen3-TTS — voice cloning</option>
        </select>
      </div>

      <!-- Text Input -->
      <div class="form-group">
        <label class="form-label" for="text-input">Text to speak</label>
        <textarea
          id="text-input"
          name="text"
          rows="4"
          placeholder="Type or paste the text you want to convert to speech…"
          required
        ></textarea>
      </div>

      <!-- Voice Instructions / Reference Transcript -->
      <div class="form-group">
        <label class="form-label" for="instructions-input">
          <span id="instructions-label-text">Voice instructions</span>
          <span class="form-label__hint" id="instructions-hint">— optional tone / style guidance</span>
        </label>
        <textarea
          id="instructions-input"
          name="instructions"
          rows="2"
          placeholder="e.g. Speak in a calm, warm tone with a slight British accent…"
        ></textarea>
      </div>

      <!-- Reference Audio Upload (Qwen3 only) -->
      <div class="form-group form-group--hidden" id="ref-audio-group">
        <label class="form-label" for="ref-audio-input">
          Reference audio
          <span class="form-label__hint">— upload a voice sample to clone (3+ seconds recommended)</span>
        </label>
        <div class="file-input-wrapper">
          <input
            type="file"
            id="ref-audio-input"
            name="reference_audio"
            accept="audio/*"
          />
          <div class="file-input-label" id="file-input-label">
            <span class="file-input-icon">📎</span>
            <span class="file-input-text">Choose an audio file…</span>
          </div>
        </div>
      </div>

      <!-- OpenAI-specific options -->
      <div id="openai-options">
        <!-- Voice & Format selectors (side-by-side) -->
        <div class="form-row" style="margin-bottom: 1.25rem;">
          <div class="form-group">
            <label class="form-label" for="voice-select">Voice</label>
            <select id="voice-select" name="voice">
              <option value="alloy">Alloy</option>
              <option value="ash">Ash</option>
              <option value="ballad">Ballad</option>
              <option value="coral">Coral</option>
              <option value="echo">Echo</option>
              <option value="fable">Fable</option>
              <option value="nova" selected>Nova</option>
              <option value="onyx">Onyx</option>
              <option value="sage">Sage</option>
              <option value="shimmer">Shimmer</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="format-select">Format</label>
            <select id="format-select" name="format">
              <option value="mp3" selected>MP3</option>
              <option value="wav">WAV</option>
            </select>
          </div>
        </div>

        <!-- Model selector -->
        <div class="form-group">
          <label class="form-label" for="model-select">Model</label>
          <select id="model-select" name="model">
            <option value="gpt-4o-mini-tts" selected>gpt-4o-mini-tts — fast</option>
            <option value="gpt-4o-tts">gpt-4o-tts — premium</option>
          </select>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-submit" type="submit" id="submit-btn">
        Generate Speech
      </button>
    </form>

    <!-- Error display -->
    <div class="error-toast" id="error-toast"></div>

    <!-- Result player -->
    <div class="result" id="result-section">
      <p class="result__label"><span class="dot"></span> Generated Audio</p>
      <div class="audio-wrapper">
        <audio id="audio-player" controls></audio>
        <a id="download-link" class="btn-download" download="speech.mp3">
          ⬇ Download
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    Built with
    <a href="https://platform.openai.com/docs/guides/text-to-speech" target="_blank" rel="noopener">OpenAI TTS API</a>
    &
    <a href="https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base" target="_blank" rel="noopener">Qwen3-TTS</a>
  </footer>

  <!-- --------------- JS --------------- -->
  <script>
    (() => {
      const form       = document.getElementById('tts-form');
      const submitBtn  = document.getElementById('submit-btn');
      const errorToast = document.getElementById('error-toast');
      const resultSec  = document.getElementById('result-section');
      const audioEl    = document.getElementById('audio-player');
      const dlLink     = document.getElementById('download-link');

      // Engine-specific UI elements
      const engineSelect       = document.getElementById('engine-select');
      const openaiOptions      = document.getElementById('openai-options');
      const refAudioGroup      = document.getElementById('ref-audio-group');
      const refAudioInput      = document.getElementById('ref-audio-input');
      const fileInputLabel     = document.getElementById('file-input-label');
      const instructionsLabel  = document.getElementById('instructions-label-text');
      const instructionsHint   = document.getElementById('instructions-hint');
      const instructionsInput  = document.getElementById('instructions-input');

      // Previous object URL (for cleanup)
      let prevBlobUrl = null;

      // ------------------------------------------------------------------
      // Engine toggle — show/hide relevant controls
      // ------------------------------------------------------------------
      engineSelect.addEventListener('change', () => {
        const isQwen = engineSelect.value === 'qwen3';

        // Toggle OpenAI-specific options
        openaiOptions.classList.toggle('form-group--hidden', isQwen);

        // Toggle reference audio upload
        refAudioGroup.classList.toggle('form-group--hidden', !isQwen);

        // Relabel the instructions field based on engine
        if (isQwen) {
          instructionsLabel.textContent = 'Reference audio transcript';
          instructionsHint.textContent  = '— type what is spoken in the uploaded audio';
          instructionsInput.placeholder = 'e.g. Hello, my name is Sarah and I love reading books…';
        } else {
          instructionsLabel.textContent = 'Voice instructions';
          instructionsHint.textContent  = '— optional tone / style guidance';
          instructionsInput.placeholder = 'e.g. Speak in a calm, warm tone with a slight British accent…';
        }
      });

      // ------------------------------------------------------------------
      // Custom file input display
      // ------------------------------------------------------------------
      refAudioInput.addEventListener('change', () => {
        const fileName = refAudioInput.files[0]?.name;
        const textEl   = fileInputLabel.querySelector('.file-input-text');
        if (fileName) {
          textEl.textContent = fileName;
          fileInputLabel.classList.add('file-input-label--selected');
        } else {
          textEl.textContent = 'Choose an audio file…';
          fileInputLabel.classList.remove('file-input-label--selected');
        }
      });

      // ------------------------------------------------------------------
      // Form submission
      // ------------------------------------------------------------------
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset UI
        errorToast.style.display = 'none';
        resultSec.style.display  = 'none';

        const engine       = engineSelect.value;
        const text         = document.getElementById('text-input').value.trim();
        const instructions = instructionsInput.value.trim();

        if (!text) {
          showError('Please enter some text.');
          return;
        }

        // Qwen3 requires a reference audio file
        if (engine === 'qwen3' && (!refAudioInput.files || refAudioInput.files.length === 0)) {
          showError('Please upload a reference audio file for voice cloning.');
          return;
        }

        // Build multipart/form-data payload
        const fd = new FormData();
        fd.append('engine', engine);
        fd.append('text', text);
        fd.append('instructions', instructions);

        if (engine === 'openai') {
          fd.append('voice', document.getElementById('voice-select').value);
          fd.append('format', document.getElementById('format-select').value);
          fd.append('model', document.getElementById('model-select').value);
        }

        if (engine === 'qwen3' && refAudioInput.files[0]) {
          fd.append('reference_audio', refAudioInput.files[0]);
        }

        // Show loading state
        submitBtn.disabled  = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Generating…';

        try {
          const res = await fetch('/api/tts', {
            method: 'POST',
            body: fd,
            // Do NOT set Content-Type — the browser auto-sets the
            // correct multipart boundary when using FormData.
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Unknown error' }));
            throw new Error(err.error || `Server returned ${res.status}`);
          }

          const blob = await res.blob();

          // Revoke previous URL to avoid memory leaks
          if (prevBlobUrl) URL.revokeObjectURL(prevBlobUrl);

          const url = URL.createObjectURL(blob);
          prevBlobUrl = url;

          // Determine format for download name
          const fmt  = engine === 'qwen3' ? 'wav' : document.getElementById('format-select').value;
          const mime = fmt === 'wav' ? 'audio/wav' : 'audio/mpeg';

          // Set up audio player
          audioEl.src  = url;
          audioEl.type = mime;

          // Set up download link
          dlLink.href     = url;
          dlLink.download = `speech.${fmt}`;

          resultSec.style.display = 'block';
          audioEl.play().catch(() => {}); // auto-play (may be blocked)

        } catch (err) {
          showError(err.message);
        } finally {
          submitBtn.disabled  = false;
          submitBtn.innerHTML = 'Generate Speech';
        }
      });

      function showError(msg) {
        errorToast.textContent   = msg;
        errorToast.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
